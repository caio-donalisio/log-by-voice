[project]
name = "telegram-audio-bot"
version = "0.1.0"
description = "Bot Telegram que transcreve audios localmente (faster-whisper) e gera notas diarias no Obsidian via LLM local (Ollama)"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.6",
    "faster-whisper>=1.0.3",
    "python-dotenv>=1.0.1",
    "ollama>=0.4.0",
]
