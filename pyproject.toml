[project]
name = "log-by-voice"
version = "0.1.0"
description = "Telegram bot that transcribes voice notes locally (faster-whisper) and logs structured entries to Obsidian daily notes via pattern matching + a local LLM (Ollama)"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.6",
    "faster-whisper>=1.0.3",
    "python-dotenv>=1.0.1",
    "ollama>=0.4.0",
]
